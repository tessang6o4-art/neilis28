<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>You're our world 💗</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
  >

  <style>
    :root {
      --pink: #ff5fa2;
      --pink-dark: #df397f;
      --pink-pale: #ffe1ee;

      --green: #61c98b;
      --green-dark: #269c62;
      --green-pale: #dff6df;

      --yellow: #ffd95a;
      --blue: #63c7ef;
      --orange: #ff9b54;
      --purple: #ab82ea;

      --ink: #493b50;
      --paper: #fffaf4;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font-family: "Nunito", sans-serif;
      background: #dff6e7;
    }

    button {
      color: inherit;
      font: inherit;
    }

    /* =========================================================
       MAP
       ========================================================= */

    #map {
      position: fixed;
      inset: 0;
      background: #d7efe1;
    }

    .leaflet-tile-pane {
      filter:
        saturate(0.82)
        brightness(1.04)
        sepia(0.06)
        hue-rotate(305deg);
    }

    .leaflet-control-zoom {
      margin: 90px 0 0 18px !important;
      border: 0 !important;
      box-shadow: 0 6px 20px rgba(65, 43, 67, 0.15) !important;
    }

    .leaflet-control-zoom a {
      color: var(--pink-dark) !important;
      background: #fffaf5 !important;
      border: 0 !important;
    }

    .leaflet-control-attribution {
      font-size: 9px !important;
      opacity: 0.72;
    }

    /* =========================================================
       INTRO SCREEN
       ========================================================= */

    .intro {
      position: fixed;
      z-index: 5000;
      inset: 0;

      display: grid;
      place-items: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at 14% 16%,
          rgba(255, 217, 90, 0.85) 0 5%,
          transparent 5.2%
        ),
        radial-gradient(
          circle at 88% 82%,
          rgba(99, 199, 239, 0.7) 0 7%,
          transparent 7.2%
        ),
        radial-gradient(
          circle at 82% 15%,
          rgba(171, 130, 234, 0.5) 0 4%,
          transparent 4.2%
        ),
        linear-gradient(
          145deg,
          #ffd9e9 0%,
          #fff3cc 45%,
          #dff6df 100%
        );

      transition:
        opacity 0.65s ease,
        visibility 0.65s ease;
    }

    .intro.gone {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .confetti {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti span {
      position: absolute;
      font-size: clamp(22px, 3vw, 42px);
      filter: drop-shadow(0 5px 6px rgba(66, 44, 66, 0.12));
      animation: float 4s ease-in-out infinite;
    }

    .confetti span:nth-child(1) {
      top: 13%;
      left: 8%;
    }

    .confetti span:nth-child(2) {
      top: 20%;
      right: 9%;
      animation-delay: -1s;
    }

    .confetti span:nth-child(3) {
      bottom: 15%;
      left: 13%;
      animation-delay: -2s;
    }

    .confetti span:nth-child(4) {
      right: 12%;
      bottom: 13%;
      animation-delay: -0.5s;
    }

    .confetti span:nth-child(5) {
      top: 7%;
      left: 48%;
      animation-delay: -2.8s;
    }

    @keyframes float {
      50% {
        transform: translateY(-13px) rotate(6deg);
      }
    }

    .intro-card {
      position: relative;
      width: min(670px, 94vw);
      padding: 74px 42px 54px;

      text-align: center;

      background: rgba(255, 250, 244, 0.97);
      border: 4px solid white;
      border-radius: 42px;
      box-shadow: 0 25px 70px rgba(80, 45, 75, 0.2);

      transform: rotate(-0.5deg);
    }

    .intro-card::before,
    .intro-card::after {
      content: "";
      position: absolute;
      top: -15px;

      width: 120px;
      height: 34px;

      background: rgba(255, 217, 90, 0.82);
      box-shadow: 0 2px 5px rgba(80, 50, 50, 0.08);
    }

    .intro-card::before {
      left: 38px;
      transform: rotate(-8deg);
    }

    .intro-card::after {
      right: 35px;
      background: rgba(99, 199, 239, 0.65);
      transform: rotate(8deg);
    }

    .mini-heart {
      display: block;
      font-size: 54px;
      filter: drop-shadow(0 7px 8px rgba(255, 95, 162, 0.3));
      animation: heartbeat 1.6s infinite;
    }

    @keyframes heartbeat {
      0%,
      40%,
      100% {
        transform: scale(1);
      }

      15% {
        transform: scale(1.14);
      }
    }

    h1 {
      margin: 10px 0 14px;

      color: var(--pink-dark);
      font-family: "Fredoka", sans-serif;
      font-size: clamp(39px, 7vw, 73px);
      line-height: 1;
      letter-spacing: -2px;

      text-shadow:
        0 4px 0 #fff,
        0 7px 0 rgba(255, 95, 162, 0.12);
    }

    .intro-sub {
      margin: 0 0 31px;
      color: var(--green-dark);
      font-family: "Fredoka", sans-serif;
      font-size: clamp(20px, 3vw, 29px);
    }

    .enter-btn {
      padding: 16px 32px;

      color: white;
      font-family: "Fredoka", sans-serif;
      font-size: 19px;
      font-weight: 700;

      cursor: pointer;
      background: linear-gradient(180deg, #ff85b7, var(--pink));
      border: 0;
      border-radius: 999px;
      box-shadow:
        0 8px 0 var(--pink-dark),
        0 12px 24px rgba(223, 57, 127, 0.22);

      transition:
        transform 0.18s,
        box-shadow 0.18s;
    }

    .enter-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 10px 0 var(--pink-dark),
        0 15px 25px rgba(223, 57, 127, 0.25);
    }

    .enter-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 var(--pink-dark);
    }

    .from-us {
      margin: 26px 0 0;
      color: #8a748c;
      font-size: 14px;
      font-weight: 800;
    }

    /* =========================================================
       MAP HEADER
       ========================================================= */

    .brand {
      position: fixed;
      z-index: 900;
      top: 17px;
      left: 18px;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 10px 16px 10px 11px;

      color: var(--pink-dark);
      font-family: "Fredoka", sans-serif;
      font-weight: 700;

      background: rgba(255, 250, 244, 0.94);
      border: 2px solid white;
      border-radius: 999px;
      box-shadow: 0 7px 25px rgba(73, 59, 80, 0.13);
    }

    .brand-heart {
      display: grid;
      place-items: center;

      width: 36px;
      height: 36px;

      font-size: 21px;
      background: var(--pink-pale);
      border-radius: 50%;
    }

    .controls {
      position: fixed;
      z-index: 900;
      top: 18px;
      right: 18px;

      display: flex;
      gap: 9px;
    }

    .pill {
      padding: 10px 15px;

      font-weight: 900;
      cursor: pointer;

      background: rgba(255, 250, 244, 0.95);
      border: 2px solid white;
      border-radius: 999px;
      box-shadow: 0 7px 22px rgba(73, 59, 80, 0.13);

      transition:
        transform 0.2s,
        background 0.2s;
    }

    .pill:hover {
      background: white;
      transform: translateY(-2px);
    }

    .progress-pill {
      color: var(--green-dark);
    }

    /* =========================================================
       HEART MARKERS
       ========================================================= */

    .heart-icon {
      overflow: visible !important;
      background: transparent;
      border: 0;
    }

    .heart-marker {
      position: relative;

      display: grid;
      place-items: center;

      width: 42px;
      height: 42px;

      cursor: pointer;
      filter: drop-shadow(0 5px 5px rgba(98, 46, 76, 0.3));
    }

    .heart-marker .pulse {
      position: absolute;

      width: 32px;
      height: 32px;

      background: rgba(255, 95, 162, 0.28);
      border-radius: 50%;

      animation: pulse 1.8s ease-out infinite;
    }

    .heart-marker .heart {
      position: relative;

      color: var(--pink);
      font-size: 39px;
      line-height: 1;

      text-shadow:
        0 -2px 0 rgba(255, 255, 255, 0.7),
        0 2px 0 var(--pink-dark);

      transition: color 0.25s;
    }

    .heart-marker .shine {
      position: absolute;
      z-index: 2;
      top: 11px;
      left: 12px;

      width: 7px;
      height: 4px;

      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      transform: rotate(-28deg);
    }

    .heart-marker .sparkle {
      position: absolute;
      top: -10px;
      right: -8px;

      display: none;

      font-size: 18px;
      animation: twinkle 1.2s ease-in-out infinite alternate;
    }

    .heart-marker.visited .pulse {
      background: rgba(97, 201, 139, 0.25);
    }

    .heart-marker.visited .heart {
      color: var(--green);

      text-shadow:
        0 -2px 0 rgba(255, 255, 255, 0.7),
        0 2px 0 var(--green-dark);
    }

    .heart-marker.visited .sparkle {
      display: block;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
        transform: scale(0.55);
      }

      100% {
        opacity: 0;
        transform: scale(1.9);
      }
    }

    @keyframes twinkle {
      to {
        transform: scale(1.35) rotate(20deg);
      }
    }

    /* =========================================================
       CLUSTERS
       ========================================================= */

    .custom-cluster {
      background: transparent !important;
    }

    .cluster-bubble {
      position: relative;

      display: grid;
      place-items: center;

      width: 50px;
      height: 50px;

      color: white;
      font-family: "Fredoka", sans-serif;
      font-size: 16px;
      font-weight: 800;

      background: linear-gradient(145deg, #ff93be, var(--pink));
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 6px 18px rgba(223, 57, 127, 0.35);
    }

    .cluster-bubble::after {
      content: "♥";
      position: absolute;
      top: -11px;
      right: -7px;

      color: var(--yellow);
      font-size: 20px;
      text-shadow: 0 1px white;
    }

    /* =========================================================
       LOCATION DRAWER
       ========================================================= */

    .scrim {
      position: fixed;
      z-index: 1080;
      inset: 0;

      visibility: hidden;
      opacity: 0;

      background: rgba(47, 32, 47, 0.22);
      transition:
        visibility 0.25s,
        opacity 0.25s;
    }

    .scrim.open {
      visibility: visible;
      opacity: 1;
    }

    .drawer {
      position: fixed;
      z-index: 1100;
      top: 0;
      right: 0;

      width: min(380px, 92vw);
      height: 100%;
      padding: 25px 20px;
      overflow: auto;

      background: var(--paper);
      box-shadow: -15px 0 50px rgba(61, 38, 59, 0.22);

      transform: translateX(110%);
      transition: transform 0.35s ease;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .drawer h2 {
      margin: 0;
      color: var(--pink-dark);
      font-family: "Fredoka", sans-serif;
      font-size: 30px;
    }

    .x-btn {
      width: 38px;
      height: 38px;

      color: var(--pink-dark);
      font-weight: 900;
      cursor: pointer;

      background: var(--pink-pale);
      border: 0;
      border-radius: 50%;
    }

    .place-list {
      display: grid;
      gap: 10px;
    }

    .place-item {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      align-items: center;
      gap: 10px;

      width: 100%;
      padding: 11px;

      text-align: left;
      cursor: pointer;

      background: white;
      border: 2px solid #f1e6ed;
      border-radius: 18px;

      transition:
        transform 0.18s,
        border-color 0.18s;
    }

    .place-item:hover {
      border-color: #ffc3dc;
      transform: translateX(-3px);
    }

    .place-emoji {
      display: grid;
      place-items: center;

      width: 45px;
      height: 45px;

      font-size: 23px;
      background: var(--pink-pale);
      border-radius: 14px;
    }

    .place-item.seen .place-emoji {
      background: var(--green-pale);
    }

    .place-name {
      font-weight: 900;
    }

    .place-landmark {
      color: #88758b;
      font-size: 12px;
    }

    .status {
      font-size: 19px;
    }

    .reset-btn {
      width: 100%;
      margin-top: 18px;
      padding: 11px;

      color: #92778a;
      font-weight: 800;
      cursor: pointer;

      background: transparent;
      border: 2px dashed #dcbfce;
      border-radius: 14px;
    }

    /* =========================================================
       MEMORY WINDOW
       ========================================================= */

    .modal-layer {
      position: fixed;
      z-index: 2000;
      inset: 0;

      display: grid;
      place-items: center;

      visibility: hidden;
      padding: 22px;
      opacity: 0;

      background: rgba(55, 36, 55, 0.5);
      backdrop-filter: blur(5px);

      transition:
        visibility 0.28s,
        opacity 0.28s;
    }

    .modal-layer.open {
      visibility: visible;
      opacity: 1;
    }

    .memory-card {
      position: relative;

      width: min(860px, 96vw);
      max-height: min(90vh, 850px);
      overflow: auto;

      background: var(--paper);
      border: 4px solid white;
      border-radius: 31px;
      box-shadow: 0 25px 80px rgba(34, 21, 37, 0.35);

      transform: translateY(22px) rotate(0.3deg);
      transition: transform 0.3s;
    }

    .modal-layer.open .memory-card {
      transform: translateY(0) rotate(0.3deg);
    }

    .tape {
      position: absolute;
      z-index: 3;
      top: -2px;
      left: 50%;

      width: 135px;
      height: 35px;

      background: rgba(255, 217, 90, 0.79);
      box-shadow: 0 3px 7px rgba(71, 48, 55, 0.09);

      clip-path: polygon(3% 7%, 98% 0, 95% 100%, 0 90%);
      transform: translateX(-50%) rotate(-2deg);
    }

    .modal-close {
      position: sticky;
      z-index: 9;
      top: 14px;
      float: right;

      width: 42px;
      height: 42px;
      margin: 14px 14px -55px 0;

      color: white;
      font-size: 18px;
      font-weight: 900;

      cursor: pointer;
      background: var(--pink);
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 5px 14px rgba(61, 38, 59, 0.18);
    }

    .memory-top {
      padding: 50px 38px 25px;
      text-align: center;

      background: linear-gradient(
        130deg,
        #ffe3ef,
        #fff4c9 56%,
        #e4f6e4
      );
    }

    .big-emoji {
      font-size: 47px;
      filter: drop-shadow(0 5px 6px rgba(54, 39, 53, 0.14));
    }

    .memory-top h2 {
      max-width: 730px;
      margin: 9px auto 8px;

      color: var(--pink-dark);
      font-family: "Fredoka", sans-serif;
      font-size: clamp(29px, 5vw, 46px);
      line-height: 1.08;
    }

    .where {
      color: var(--green-dark);
      font-weight: 900;
    }

    .memory-body {
      padding: 25px 31px 31px;
    }

    /* =========================================================
       PHOTO GALLERY

       The explicit height on .photo-stage prevents Safari from
       collapsing an image into a thin strip.

       object-fit: contain shows the entire image without cropping.
       ========================================================= */

    .gallery {
      display: flex;
      align-items: flex-start;
      gap: 18px;

      width: 100%;
      padding: 8px 5px 24px;
      overflow-x: auto;
      overflow-y: hidden;

      scroll-snap-type: x mandatory;
      scrollbar-color: var(--pink-pale) transparent;
      scrollbar-width: thin;
    }

    .gallery.single-photo {
      justify-content: center;
    }

    .gallery::-webkit-scrollbar {
      height: 9px;
    }

    .gallery::-webkit-scrollbar-track {
      background: transparent;
    }

    .gallery::-webkit-scrollbar-thumb {
      background: var(--pink-pale);
      border-radius: 999px;
    }

    .photo {
      flex: 0 0 min(420px, 82vw);
      width: min(420px, 82vw);
      margin: 0;
      padding: 10px;

      overflow: hidden;

      background: white;
      border-radius: 7px;
      box-shadow: 0 7px 18px rgba(68, 43, 62, 0.15);

      scroll-snap-align: center;
      transform: rotate(-1deg);
    }

    .photo:nth-child(even) {
      transform: rotate(1.5deg);
    }

    /*
      This explicit height is the key fix.
      It gives every photo a real area in which to render.
    */
    .photo-stage {
      position: relative;

      display: grid;
      place-items: center;

      width: 100%;
      height: clamp(300px, 50vh, 430px);

      overflow: hidden;

      background: linear-gradient(145deg, #fce4ef, #e5f5e8);
      border-radius: 3px;
    }

    /*
      Every image fills the available frame while retaining its
      original proportions.
    */
    .photo-stage img {
      position: absolute;
      z-index: 2;
      inset: 0;

      display: block;

      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;

      object-fit: contain;
      object-position: center;

      background: #fdf8f5;
    }

    .photo-fallback {
      position: absolute;
      z-index: 1;
      inset: 0;

      display: grid;
      place-content: center;

      padding: 15px;

      color: #735c72;
      font-weight: 900;
      text-align: center;

      background: linear-gradient(145deg, #ffddec, #dff4df);
    }

    .fallback-emoji {
      display: block;
      margin-bottom: 8px;
      font-size: 48px;
    }

    .photo-fallback small {
      display: block;
      max-width: 280px;
      margin-top: 8px;

      overflow-wrap: anywhere;
      opacity: 0.72;
    }

    .photo-caption {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 42px;
      padding: 8px 8px 2px;

      color: #755f73;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }

    .photo-caption:empty::after {
      content: "💗";
      opacity: 0.45;
    }

    .blurb {
      position: relative;

      margin: 8px 4px 23px;
      padding: 21px 24px 21px 29px;

      font-size: 18px;
      font-weight: 700;
      line-height: 1.6;

      background: white;
      border-left: 7px solid var(--green);
      border-radius: 5px 22px 22px 5px;
      box-shadow: 0 5px 16px rgba(65, 44, 62, 0.08);
    }

    .blurb::before {
      content: "“";
      position: absolute;
      top: -4px;
      left: 8px;

      color: var(--green);
      font: 42px Georgia, serif;
      opacity: 0.45;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 13px;
      flex-wrap: wrap;
    }

    .love-note {
      color: #967e92;
      font-size: 13px;
      font-weight: 900;
    }

    .nearby-btn {
      padding: 13px 19px;

      color: white;
      font-weight: 900;
      cursor: pointer;

      background: linear-gradient(180deg, #7ad79d, var(--green));
      border: 0;
      border-radius: 999px;
      box-shadow: 0 6px 0 var(--green-dark);

      transition: transform 0.18s;
    }

    .nearby-btn:hover {
      transform: translateY(-2px);
    }

    /* =========================================================
       TOAST
       ========================================================= */

    .toast {
      position: fixed;
      z-index: 4000;
      bottom: 25px;
      left: 50%;

      max-width: min(90vw, 600px);
      padding: 11px 18px;

      color: white;
      font-weight: 800;
      text-align: center;

      pointer-events: none;
      opacity: 0;

      background: #493b50;
      border-radius: 999px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);

      transform: translate(-50%, 20px);

      transition:
        opacity 0.25s,
        transform 0.25s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================================================
       PHONE LAYOUT
       ========================================================= */

    @media (max-width: 650px) {
      .intro-card {
        padding: 59px 23px 40px;
        border-radius: 31px;
      }

      .controls {
        top: auto;
        right: 12px;
        bottom: 18px;
      }

      .brand {
        top: 12px;
        left: 12px;
      }

      .brand-title {
        display: none;
      }

      .leaflet-control-zoom {
        margin-top: 72px !important;
        margin-left: 12px !important;
      }

      .progress-pill {
        padding: 10px 12px;
      }

      .modal-layer {
        padding: 10px;
      }

      .memory-card {
        max-height: 92vh;
        border-radius: 24px;
      }

      .memory-top {
        padding: 48px 20px 22px;
      }

      .memory-body {
        padding: 19px 16px 25px;
      }

      .photo {
        flex-basis: 84vw;
        width: 84vw;
      }

      .photo-stage {
        height: min(55vh, 390px);
        min-height: 280px;
      }

      .blurb {
        font-size: 16px;
      }

      .card-footer {
        justify-content: center;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <div
    id="map"
    aria-label="Interactive map of memories"
  ></div>

  <!-- Intro screen -->
  <section class="intro" id="intro">
    <div class="confetti" aria-hidden="true">
      <span>🌼</span>
      <span>✨</span>
      <span>🌷</span>
      <span>⭐</span>
      <span>💚</span>
    </div>

    <div class="intro-card">
      <span class="mini-heart">💗</span>

      <h1>You're our world</h1>

      <p class="intro-sub">
        Let's see where you've been
      </p>

      <button
        class="enter-btn"
        id="enterBtn"
        type="button"
      >
        Open your map ✨
      </button>

      <p class="from-us">
        Made with so much love, from all of us
      </p>
    </div>
  </section>

  <!-- Map title -->
  <div class="brand">
    <span class="brand-heart">💗</span>
    <span class="brand-title">You're our world</span>
  </div>

  <!-- Map controls -->
  <div class="controls">
    <button
      class="pill"
      id="musicBtn"
      type="button"
      title="Play or pause music"
    >
      ♫ Play song
    </button>

    <button
      class="pill progress-pill"
      id="placesBtn"
      type="button"
    >
      <span id="progressText">0 / 5</span> hearts
    </button>
  </div>

  <!-- Place-list drawer -->
  <div class="scrim" id="drawerScrim"></div>

  <aside
    class="drawer"
    id="drawer"
    aria-label="All places"
  >
    <div class="drawer-head">
      <h2>Our places 💗</h2>

      <button
        class="x-btn"
        id="drawerClose"
        type="button"
        aria-label="Close place list"
      >
        ✕
      </button>
    </div>

    <div class="place-list" id="placeList"></div>

    <button
      class="reset-btn"
      id="resetBtn"
      type="button"
    >
      Reset visited hearts
    </button>
  </aside>

  <!-- Memory window -->
  <div
    class="modal-layer"
    id="modalLayer"
    role="dialog"
    aria-modal="true"
    aria-labelledby="memoryTitle"
  >
    <article class="memory-card">
      <div class="tape"></div>

      <button
        class="modal-close"
        id="modalClose"
        type="button"
        aria-label="Close memory"
      >
        ✕
      </button>

      <header class="memory-top">
        <div class="big-emoji" id="modalEmoji"></div>
        <h2 id="memoryTitle"></h2>
        <div class="where" id="modalWhere"></div>
      </header>

      <div class="memory-body">
        <div class="gallery" id="modalGallery"></div>

        <div class="blurb" id="modalBlurb"></div>

        <footer class="card-footer">
          <span class="love-note">
            With love, from all of us 💞
          </span>

          <button
            class="nearby-btn"
            id="nearbyBtn"
            type="button"
          >
            Visit somewhere nearby →
          </button>
        </footer>
      </div>
    </article>
  </div>

  <div class="toast" id="toast"></div>

  <audio
    id="song"
    loop
    preload="auto"
    playsinline
  ></audio>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    /* =========================================================
       MUSIC

       The file should be:
       music/oursong.mp3
       ========================================================= */

    const SONG_FILE = "music/oursong.mp3";

    /* =========================================================
       MEMORIES

       Add photos like this:

       photos: [
         {
           file: "photos/london/london-1.jpg",
           caption: "Optional caption"
         }
       ]

       The caption can remain empty.
       ========================================================= */

    const MEMORIES = [
      {
        id: "mexico-tijuana",
        location: "Tijuana, Mexico",
        landmark: "Ruth's House",
        title: "¿Cómo no vamos a ser felices en México?",
        emoji: "🇲🇽",
        coordinates: [32.5193, -117.1195],
        memory:
          "The joy brought to you by a 90 pesos car wash cannot be understated.",
        photos: [
          {
            file: "photos/tijuanapatcopy.jpeg",
            caption: ""
          }
        ]
      },

      {
        id: "paris-lovre",
        location: "Paris, France",
        landmark: "Musée du Louvre",
        title: "Tojours faire le pitre",
        emoji: "🥐",
        coordinates: [48.8608, 2.3376],
        memory:
          "Even though we failed to unlock the vélib, I had so much fun exploring Paris on foot with you!",
        photos: [
          {
            file: "photos/louvresilly.jpeg",
            caption: ""
          },
          {
            file: "photos/louvretongue.jpeg",
            caption: ""
          }
        ]
      },

      {
        id: "irvine-usa",
        location: "Irvine, USA",
        landmark: "The Cheesecake Factory",
        title: "A slice of home",
        emoji: "🍰",
        coordinates: [33.6512, -117.7463],
        memory:
          "We never say no to a free slice of cake (especially not if it's chocolate)...",
        photos: [
          {
            file: "photos/irvinecake.jpeg",
            caption: ""
          }
        ]
      },
      {
        id: "crystalcove-usa",
        location: "Newport Beach, USA",
        landmark: "Crystal Cove State Park",
        title: "From cycle to surf, you're always the best company!",
        emoji: "🌊",
        coordinates: [33.5805, -117.8542],
        memory:
          "I think you're the best body surfer I know... maybe even the only body surfer I know.",
        photos: [
          {
            file: "photos/crystalcovetrail.jpeg",
            caption: ""
          },
          {
            file: "photos/crystalcovebeach.jpeg",
            caption: ""
          }
        ]
      },
      {
        id: "batu-ferringhi",
        location: "Batu Ferringhi, Malaysia",
        landmark: "Sea Horse Watersports",
        title: "You're the wind in my sails",
        emoji: "🪂",
        coordinates: [5.4835, 100.2528],
        memory:
          "We were having so much fun even the jelly fish wanted to join in (I'm sorry you got stung)!",
        photos: [
          {
            file: "photos/batuferringhibeach.jpeg",
            caption: ""
          },
          {
            file: "photos/batuferringhiparasailing.jpeg",
            caption: ""
          }
        ]
      },
      {
        id: "yai-house",
        location: "Baan Suan Maak, Thailand",
        landmark: "Yai's House",
        title: "เขาชอบมะพร้าว (I like coconut)",
        emoji: "🥥",
        coordinates: [14.6940, 101.9900],
        memory:
          "My family had a little bit too much fun feeding you!",
        photos: [
          {
            file: "photos/bsmyaigazebo.jpeg",
            caption: ""
          },
          {
            file: "photos/bsmfood.jpeg",
            caption: ""
          }
        ]
      }
    ];

    /* =========================================================
       PAGE ELEMENTS
       ========================================================= */

    const intro = document.getElementById("intro");
    const modalLayer = document.getElementById("modalLayer");
    const drawer = document.getElementById("drawer");
    const drawerScrim = document.getElementById("drawerScrim");
    const song = document.getElementById("song");
    const musicBtn = document.getElementById("musicBtn");
    const toast = document.getElementById("toast");

    let currentId = null;
    let toastTimer = null;

    const markers = {};

    function loadVisitedPlaces() {
      try {
        const saved = JSON.parse(
          localStorage.getItem("ourWorldVisited") || "[]"
        );

        const validIds = new Set(
          MEMORIES.map((place) => place.id)
        );

        return new Set(
          saved.filter((id) => validIds.has(id))
        );
      } catch (error) {
        console.error("Could not load visited places:", error);
        return new Set();
      }
    }

    let visited = loadVisitedPlaces();

    /* =========================================================
       MUSIC
       ========================================================= */

    if (SONG_FILE) {
      song.src = SONG_FILE;
      song.volume = 0.75;
      song.load();
      musicBtn.textContent = "♫ Play song";
    } else {
      musicBtn.textContent = "♪ Silent demo";
    }

    song.addEventListener("play", () => {
      musicBtn.textContent = "❚❚ Pause";
    });

    song.addEventListener("pause", () => {
      musicBtn.textContent = "♫ Play song";
    });

    song.addEventListener("error", () => {
      console.error(
        "The song could not be loaded:",
        SONG_FILE,
        song.error
      );

      musicBtn.textContent = "⚠ Check song";
      showToast(
        "The song could not be found. Check music/oursong.mp3"
      );
    });

    async function playSong() {
      if (!SONG_FILE) {
        showToast("No song has been added yet 🎵");
        return;
      }

      try {
        await song.play();
      } catch (error) {
        console.error("The browser could not play the song:", error);
        musicBtn.textContent = "♫ Play song";

        showToast(
          "The song could not play. Check its filename and format."
        );
      }
    }

    /* =========================================================
       MAP
       ========================================================= */

    const map = L.map("map", {
      worldCopyJump: true,
      minZoom: 2,
      zoomControl: true
    }).setView([25, 5], 2);

    L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);

    const cluster = L.markerClusterGroup({
      showCoverageOnHover: false,
      maxClusterRadius: 45,
      spiderfyOnMaxZoom: true,

      iconCreateFunction: (clusterMarker) => {
        return L.divIcon({
          html:
            `<div class="cluster-bubble">` +
            `${clusterMarker.getChildCount()}` +
            `</div>`,

          className: "custom-cluster",
          iconSize: [50, 50]
        });
      }
    });

    /* =========================================================
       HEART PINS
       ========================================================= */

    function heartIcon(id) {
      const visitedClass = visited.has(id)
        ? " visited"
        : "";

      return L.divIcon({
        className: "heart-icon",
        iconSize: [42, 42],
        iconAnchor: [21, 34],

        html:
          `<div class="heart-marker${visitedClass}">` +
            `<span class="pulse"></span>` +
            `<span class="heart">♥</span>` +
            `<span class="shine"></span>` +
            `<span class="sparkle">✨</span>` +
          `</div>`
      });
    }

    MEMORIES.forEach((place) => {
      const marker = L.marker(
        place.coordinates,
        {
          icon: heartIcon(place.id),
          title: place.location
        }
      );

      marker.on("click", () => {
        openMemory(place.id);
      });

      markers[place.id] = marker;
      cluster.addLayer(marker);
    });

    map.addLayer(cluster);

    /* =========================================================
       VISITED HEARTS
       ========================================================= */

    function saveVisited() {
      localStorage.setItem(
        "ourWorldVisited",
        JSON.stringify([...visited])
      );

      document.getElementById("progressText").textContent =
        `${visited.size} / ${MEMORIES.length}`;

      renderPlaceList();
    }

    /* =========================================================
       PHOTO FUNCTIONS
       ========================================================= */

    function normalizePhoto(photo) {
      if (typeof photo === "string") {
        return {
          file: photo,
          caption: ""
        };
      }

      return {
        file: photo.file || "",
        caption: photo.caption || ""
      };
    }

    function createPhotoFrame(photo, place, index) {
      const photoInfo = normalizePhoto(photo);
      const file = photoInfo.file;
      const caption = photoInfo.caption;

      const frame = document.createElement("figure");
      frame.className = "photo";

      const stage = document.createElement("div");
      stage.className = "photo-stage";

      const fallback = document.createElement("div");
      fallback.className = "photo-fallback";

      const fallbackEmoji = document.createElement("span");
      fallbackEmoji.className = "fallback-emoji";
      fallbackEmoji.textContent = place.emoji;

      const fallbackText = document.createElement("span");
      fallbackText.textContent = "Your photo goes here";

      const fallbackFilename = document.createElement("small");
      fallbackFilename.textContent =
        file.split("/").pop() || "Missing filename";

      fallback.appendChild(fallbackEmoji);
      fallback.appendChild(fallbackText);
      fallback.appendChild(fallbackFilename);

      const image = document.createElement("img");

      image.alt =
        `Memory from ${place.location}, photo ${index + 1}`;

      image.loading = "lazy";
      image.decoding = "async";

      /*
        These handlers are added before src so Safari cannot miss
        a very fast load event.
      */
      image.addEventListener("load", () => {
        fallback.style.display = "none";
        image.style.display = "block";
      });

      image.addEventListener("error", () => {
        image.style.display = "none";
        fallback.style.display = "grid";

        console.error(
          "Photo could not be loaded:",
          file
        );
      });

      image.src = file;

      const captionElement =
        document.createElement("figcaption");

      captionElement.className = "photo-caption";
      captionElement.textContent = caption;

      stage.appendChild(fallback);
      stage.appendChild(image);

      frame.appendChild(stage);
      frame.appendChild(captionElement);

      return frame;
    }

    /* =========================================================
       MEMORY WINDOW
       ========================================================= */

    function openMemory(id) {
      const place = MEMORIES.find(
        (memory) => memory.id === id
      );

      if (!place) {
        return;
      }

      currentId = id;
      visited.add(id);

      markers[id].setIcon(heartIcon(id));
      saveVisited();

      document.getElementById("modalEmoji").textContent =
        place.emoji;

      document.getElementById("memoryTitle").textContent =
        place.title;

      document.getElementById("modalWhere").textContent =
        `${place.landmark} · ${place.location}`;

      document.getElementById("modalBlurb").textContent =
        place.memory;

      const gallery =
        document.getElementById("modalGallery");

      gallery.innerHTML = "";
      gallery.classList.remove("single-photo");

      const photos =
        place.photos && place.photos.length > 0
          ? place.photos
          : [
              {
                file: "",
                caption: ""
              }
            ];

      if (photos.length === 1) {
        gallery.classList.add("single-photo");
      }

      photos.forEach((photo, index) => {
        gallery.appendChild(
          createPhotoFrame(photo, place, index)
        );
      });

      /*
        Reset the horizontal gallery to the first photo whenever
        a new location opens.
      */
      gallery.scrollLeft = 0;

      const nextPlace = findNearest(place);
      const nearbyButton =
        document.getElementById("nearbyBtn");

      nearbyButton.textContent = nextPlace
        ? `Next nearby: ${nextPlace.location} →`
        : "Back to the map";

      modalLayer.classList.add("open");
    }

    function closeMemory() {
      modalLayer.classList.remove("open");
    }

    /* =========================================================
       NEAREST LOCATION
       ========================================================= */

    function distance(firstPlace, secondPlace) {
      const earthRadius = 6371;

      const toRadians = (number) =>
        number * Math.PI / 180;

      const latitudeDifference = toRadians(
        secondPlace.coordinates[0] -
        firstPlace.coordinates[0]
      );

      const longitudeDifference = toRadians(
        secondPlace.coordinates[1] -
        firstPlace.coordinates[1]
      );

      const calculation =
        Math.sin(latitudeDifference / 2) ** 2 +
        Math.cos(toRadians(firstPlace.coordinates[0])) *
        Math.cos(toRadians(secondPlace.coordinates[0])) *
        Math.sin(longitudeDifference / 2) ** 2;

      return (
        2 *
        earthRadius *
        Math.asin(Math.sqrt(calculation))
      );
    }

    function findNearest(place) {
      const otherPlaces = MEMORIES.filter(
        (otherPlace) => otherPlace.id !== place.id
      );

      const unvisitedPlaces = otherPlaces.filter(
        (otherPlace) => !visited.has(otherPlace.id)
      );

      const possiblePlaces =
        unvisitedPlaces.length > 0
          ? unvisitedPlaces
          : otherPlaces;

      return (
        possiblePlaces
          .slice()
          .sort(
            (firstPlace, secondPlace) =>
              distance(place, firstPlace) -
              distance(place, secondPlace)
          )[0] || null
      );
    }

    /* =========================================================
       LOCATION LIST
       ========================================================= */

    function visitFromList(id) {
      closeDrawer();

      const place = MEMORIES.find(
        (memory) => memory.id === id
      );

      if (!place) {
        return;
      }

      map.flyTo(
        place.coordinates,
        Math.max(map.getZoom(), 8),
        {
          duration: 1.1
        }
      );

      setTimeout(() => {
        openMemory(id);
      }, 850);
    }

    function renderPlaceList() {
      const list =
        document.getElementById("placeList");

      list.innerHTML = "";

      MEMORIES.forEach((place) => {
        const button =
          document.createElement("button");

        button.type = "button";

        button.className =
          "place-item" +
          (visited.has(place.id) ? " seen" : "");

        const emoji =
          document.createElement("span");

        emoji.className = "place-emoji";
        emoji.textContent = place.emoji;

        const text =
          document.createElement("span");

        const name =
          document.createElement("span");

        name.className = "place-name";
        name.textContent = place.location;

        const lineBreak =
          document.createElement("br");

        const landmark =
          document.createElement("span");

        landmark.className = "place-landmark";
        landmark.textContent = place.landmark;

        text.appendChild(name);
        text.appendChild(lineBreak);
        text.appendChild(landmark);

        const status =
          document.createElement("span");

        status.className = "status";
        status.textContent =
          visited.has(place.id) ? "✨" : "💗";

        button.appendChild(emoji);
        button.appendChild(text);
        button.appendChild(status);

        button.addEventListener("click", () => {
          visitFromList(place.id);
        });

        list.appendChild(button);
      });
    }

    /* =========================================================
       DRAWER AND TOAST
       ========================================================= */

    function openDrawer() {
      drawer.classList.add("open");
      drawerScrim.classList.add("open");
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      drawerScrim.classList.remove("open");
    }

    function showToast(message) {
      clearTimeout(toastTimer);

      toast.textContent = message;
      toast.classList.add("show");

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }

    /* =========================================================
       BUTTONS
       ========================================================= */

    document
      .getElementById("enterBtn")
      .addEventListener("click", () => {
        /*
          The song is started directly from the click so browsers
          recognize it as user-requested audio.
        */
        if (SONG_FILE) {
          playSong();
        }

        intro.classList.add("gone");

        setTimeout(() => {
          map.invalidateSize();
        }, 300);
      });

    musicBtn.addEventListener("click", () => {
      if (!SONG_FILE) {
        showToast("No song has been added yet 🎵");
        return;
      }

      if (song.paused) {
        playSong();
      } else {
        song.pause();
      }
    });

    document
      .getElementById("placesBtn")
      .addEventListener("click", openDrawer);

    document
      .getElementById("drawerClose")
      .addEventListener("click", closeDrawer);

    drawerScrim.addEventListener(
      "click",
      closeDrawer
    );

    document
      .getElementById("modalClose")
      .addEventListener("click", closeMemory);

    modalLayer.addEventListener("click", (event) => {
      if (event.target === modalLayer) {
        closeMemory();
      }
    });

    document
      .getElementById("nearbyBtn")
      .addEventListener("click", () => {
        const currentPlace = MEMORIES.find(
          (place) => place.id === currentId
        );

        if (!currentPlace) {
          closeMemory();
          return;
        }

        const nextPlace =
          findNearest(currentPlace);

        if (!nextPlace) {
          closeMemory();
          return;
        }

        closeMemory();

        map.flyTo(
          nextPlace.coordinates,
          Math.max(map.getZoom(), 8),
          {
            duration: 1.15
          }
        );

        setTimeout(() => {
          openMemory(nextPlace.id);
        }, 900);
      });

    document
      .getElementById("resetBtn")
      .addEventListener("click", () => {
        visited.clear();

        localStorage.removeItem(
          "ourWorldVisited"
        );

        MEMORIES.forEach((place) => {
          markers[place.id].setIcon(
            heartIcon(place.id)
          );
        });

        saveVisited();

        showToast(
          "All hearts are pink again 💗"
        );
      });

    document.addEventListener(
      "keydown",
      (event) => {
        if (event.key === "Escape") {
          closeMemory();
          closeDrawer();
        }
      }
    );

    /* Initial display */
    renderPlaceList();
    saveVisited();
  </script>
</body>
</html>
