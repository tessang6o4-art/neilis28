<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're our world 💗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    :root {
      --pink:#ff5fa2; --pink-dark:#df397f; --pink-pale:#ffe1ee;
      --green:#61c98b; --green-dark:#269c62; --green-pale:#dff6df;
      --yellow:#ffd95a; --blue:#63c7ef; --orange:#ff9b54; --purple:#ab82ea;
      --ink:#493b50; --paper:#fffaf4; --white:#fff;
      --shadow:0 18px 55px rgba(77,46,73,.18);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:"Nunito",sans-serif;background:#dff6e7}
    button{font:inherit;color:inherit}
    #map{position:fixed;inset:0;background:#d7efe1}
    .leaflet-tile-pane{filter:saturate(.75) brightness(1.04) sepia(.08) hue-rotate(305deg)}
    .leaflet-control-zoom{border:0!important;box-shadow:0 6px 20px rgba(65,43,67,.15)!important;margin:90px 0 0 18px!important}
    .leaflet-control-zoom a{color:var(--pink-dark)!important;border:0!important;background:#fffaf5!important}
    .leaflet-control-attribution{font-size:9px!important;opacity:.72}

    /* Intro */
    .intro{position:fixed;inset:0;z-index:5000;display:grid;place-items:center;padding:24px;background:
      radial-gradient(circle at 14% 16%,rgba(255,217,90,.85) 0 5%,transparent 5.2%),
      radial-gradient(circle at 88% 82%,rgba(99,199,239,.7) 0 7%,transparent 7.2%),
      radial-gradient(circle at 82% 15%,rgba(171,130,234,.5) 0 4%,transparent 4.2%),
      linear-gradient(145deg,#ffd9e9 0%,#fff3cc 45%,#dff6df 100%);
      transition:opacity .65s ease,visibility .65s ease}
    .intro.gone{opacity:0;visibility:hidden;pointer-events:none}
    .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
    .confetti span{position:absolute;font-size:clamp(22px,3vw,42px);filter:drop-shadow(0 5px 6px rgba(66,44,66,.12));animation:float 4s ease-in-out infinite}
    .confetti span:nth-child(1){left:8%;top:13%}.confetti span:nth-child(2){right:9%;top:20%;animation-delay:-1s}.confetti span:nth-child(3){left:13%;bottom:15%;animation-delay:-2s}.confetti span:nth-child(4){right:12%;bottom:13%;animation-delay:-.5s}.confetti span:nth-child(5){left:48%;top:7%;animation-delay:-2.8s}
    @keyframes float{50%{transform:translateY(-13px) rotate(6deg)}}
    .intro-card{position:relative;width:min(670px,94vw);padding:74px 42px 54px;text-align:center;background:rgba(255,250,244,.97);border:4px solid white;border-radius:42px;box-shadow:0 25px 70px rgba(80,45,75,.20);transform:rotate(-.5deg)}
    .intro-card:before,.intro-card:after{content:"";position:absolute;width:120px;height:34px;top:-15px;background:rgba(255,217,90,.82);box-shadow:0 2px 5px rgba(80,50,50,.08)}
    .intro-card:before{left:38px;transform:rotate(-8deg)}.intro-card:after{right:35px;transform:rotate(8deg);background:rgba(99,199,239,.65)}
    .mini-heart{font-size:54px;display:block;animation:heartbeat 1.6s infinite;filter:drop-shadow(0 7px 8px rgba(255,95,162,.3))}
    @keyframes heartbeat{0%,40%,100%{transform:scale(1)}15%{transform:scale(1.14)}}
    h1{font-family:"Fredoka",sans-serif;font-size:clamp(39px,7vw,73px);line-height:1;margin:10px 0 14px;color:var(--pink-dark);letter-spacing:-2px;text-shadow:0 4px 0 #fff,0 7px 0 rgba(255,95,162,.12)}
    .intro-sub{font-family:"Fredoka";font-size:clamp(20px,3vw,29px);color:var(--green-dark);margin:0 0 31px}
    .enter-btn{border:0;border-radius:999px;padding:16px 32px;background:linear-gradient(180deg,#ff85b7,var(--pink));color:white;font-family:"Fredoka";font-weight:700;font-size:19px;cursor:pointer;box-shadow:0 8px 0 var(--pink-dark),0 12px 24px rgba(223,57,127,.22);transition:.18s transform,.18s box-shadow}
    .enter-btn:hover{transform:translateY(-2px);box-shadow:0 10px 0 var(--pink-dark),0 15px 25px rgba(223,57,127,.25)}
    .enter-btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--pink-dark)}
    .from-us{margin:26px 0 0;color:#8a748c;font-weight:800;font-size:14px}

    /* Map chrome */
    .brand{position:fixed;z-index:900;top:17px;left:18px;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 11px;background:rgba(255,250,244,.94);border:2px solid white;border-radius:999px;box-shadow:0 7px 25px rgba(73,59,80,.13);font-family:"Fredoka";font-weight:700;color:var(--pink-dark)}
    .brand-heart{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--pink-pale);font-size:21px}
    .controls{position:fixed;z-index:900;top:18px;right:18px;display:flex;gap:9px}
    .pill{border:2px solid white;border-radius:999px;background:rgba(255,250,244,.95);padding:10px 15px;font-weight:900;box-shadow:0 7px 22px rgba(73,59,80,.13);cursor:pointer;transition:.2s}
    .pill:hover{transform:translateY(-2px);background:white}.progress-pill{color:var(--green-dark)}

    /* Heart markers */
    .heart-icon{background:transparent;border:0;overflow:visible!important}
    .heart-marker{position:relative;width:42px;height:42px;display:grid;place-items:center;filter:drop-shadow(0 5px 5px rgba(98,46,76,.3));cursor:pointer}
    .heart-marker .pulse{position:absolute;width:32px;height:32px;border-radius:50%;background:rgba(255,95,162,.28);animation:pulse 1.8s ease-out infinite}
    .heart-marker .heart{position:relative;color:var(--pink);font-size:39px;line-height:1;text-shadow:0 -2px 0 rgba(255,255,255,.7),0 2px 0 var(--pink-dark);transition:.25s}
    .heart-marker .shine{position:absolute;z-index:2;width:7px;height:4px;border-radius:50%;background:rgba(255,255,255,.9);top:11px;left:12px;transform:rotate(-28deg)}
    .heart-marker .sparkle{display:none;position:absolute;right:-8px;top:-10px;font-size:18px;animation:twinkle 1.2s ease-in-out infinite alternate}
    .heart-marker.visited .pulse{background:rgba(97,201,139,.25)}
    .heart-marker.visited .heart{color:var(--green);text-shadow:0 -2px 0 rgba(255,255,255,.7),0 2px 0 var(--green-dark)}
    .heart-marker.visited .sparkle{display:block}
    @keyframes pulse{0%{transform:scale(.55);opacity:1}100%{transform:scale(1.9);opacity:0}}
    @keyframes twinkle{to{transform:scale(1.35) rotate(20deg)}}
    .custom-cluster{background:transparent!important}
    .cluster-bubble{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ff93be,var(--pink));color:white;border:3px solid white;box-shadow:0 6px 18px rgba(223,57,127,.35);font-family:"Fredoka";font-weight:800;font-size:16px;position:relative}
    .cluster-bubble:after{content:"♥";position:absolute;right:-7px;top:-11px;color:var(--yellow);font-size:20px;text-shadow:0 1px white}

    /* Place drawer */
    .scrim{position:fixed;z-index:1080;inset:0;background:rgba(47,32,47,.22);opacity:0;visibility:hidden;transition:.25s}.scrim.open{opacity:1;visibility:visible}
    .drawer{position:fixed;z-index:1100;top:0;right:0;height:100%;width:min(380px,92vw);padding:25px 20px;background:var(--paper);box-shadow:-15px 0 50px rgba(61,38,59,.22);transform:translateX(110%);transition:.35s ease;overflow:auto}
    .drawer.open{transform:translateX(0)}
    .drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.drawer h2{font-family:"Fredoka";font-size:30px;color:var(--pink-dark);margin:0}.x-btn{width:38px;height:38px;border:0;border-radius:50%;background:var(--pink-pale);color:var(--pink-dark);font-weight:900;cursor:pointer}
    .place-list{display:grid;gap:10px}.place-item{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px;width:100%;padding:11px;text-align:left;border:2px solid #f1e6ed;border-radius:18px;background:white;cursor:pointer;transition:.18s}.place-item:hover{transform:translateX(-3px);border-color:#ffc3dc}.place-emoji{display:grid;place-items:center;width:45px;height:45px;border-radius:14px;background:var(--pink-pale);font-size:23px}.place-item.seen .place-emoji{background:var(--green-pale)}.place-name{font-weight:900}.place-landmark{font-size:12px;color:#88758b}.status{font-size:19px}
    .reset-btn{width:100%;margin-top:18px;padding:11px;border:2px dashed #dcbfce;border-radius:14px;background:transparent;color:#92778a;font-weight:800;cursor:pointer}

    /* Memory modal */
    .modal-layer{position:fixed;z-index:2000;inset:0;padding:22px;display:grid;place-items:center;background:rgba(55,36,55,.50);backdrop-filter:blur(5px);opacity:0;visibility:hidden;transition:.28s}
    .modal-layer.open{opacity:1;visibility:visible}
    .memory-card{position:relative;width:min(860px,96vw);max-height:min(88vh,800px);overflow:auto;background:var(--paper);border:4px solid white;border-radius:31px;box-shadow:0 25px 80px rgba(34,21,37,.35);transform:translateY(22px) rotate(.3deg);transition:.3s transform}
    .modal-layer.open .memory-card{transform:translateY(0) rotate(.3deg)}
    .tape{position:absolute;z-index:3;top:-2px;left:50%;width:135px;height:35px;transform:translateX(-50%) rotate(-2deg);background:rgba(255,217,90,.79);clip-path:polygon(3% 7%,98% 0,95% 100%,0 90%);box-shadow:0 3px 7px rgba(71,48,55,.09)}
    .modal-close{position:sticky;z-index:9;float:right;top:14px;margin:14px 14px -55px 0;width:42px;height:42px;border:3px solid white;border-radius:50%;background:var(--pink);color:white;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 5px 14px rgba(61,38,59,.18)}
    .memory-top{padding:50px 38px 25px;text-align:center;background:linear-gradient(130deg,#ffe3ef,#fff4c9 56%,#e4f6e4)}
    .big-emoji{font-size:47px;filter:drop-shadow(0 5px 6px rgba(54,39,53,.14))}
    .memory-top h2{font-family:"Fredoka";font-size:clamp(29px,5vw,46px);line-height:1.08;margin:9px auto 8px;color:var(--pink-dark);max-width:730px}
    .where{font-weight:900;color:var(--green-dark)}
    .memory-body{padding:25px 31px 31px}
    .gallery{display:flex;gap:15px;overflow-x:auto;padding:5px 4px 18px;scroll-snap-type:x mandatory}
    .photo{position:relative;flex:1 0 min(320px,78vw);height:245px;border:9px solid white;border-bottom-width:31px;border-radius:6px;background:linear-gradient(145deg,#f8c9dd,#caebd2);box-shadow:0 7px 18px rgba(68,43,62,.15);overflow:hidden;scroll-snap-align:center;transform:rotate(-1deg)}
    .photo:nth-child(even){transform:rotate(1.5deg)}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo-fallback{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:15px;color:#735c72;font-weight:900;background:linear-gradient(145deg,#ffddec,#dff4df)}.photo-fallback .f-emoji{font-size:48px}.photo-fallback small{display:block;margin-top:8px;opacity:.72}.photo img:not([src]),.photo img[src=""]{display:none}
    .blurb{position:relative;margin:8px 4px 23px;padding:21px 24px 21px 29px;border-radius:5px 22px 22px 5px;background:#fff;border-left:7px solid var(--green);font-size:18px;line-height:1.6;font-weight:700;box-shadow:0 5px 16px rgba(65,44,62,.08)}
    .blurb:before{content:"“";position:absolute;left:8px;top:-4px;font:42px Georgia;color:var(--green);opacity:.45}
    .card-footer{display:flex;align-items:center;justify-content:space-between;gap:13px;flex-wrap:wrap}.love-note{color:#967e92;font-size:13px;font-weight:900}.nearby-btn{border:0;border-radius:999px;padding:13px 19px;background:linear-gradient(180deg,#7ad79d,var(--green));color:white;font-weight:900;cursor:pointer;box-shadow:0 6px 0 var(--green-dark);transition:.18s}.nearby-btn:hover{transform:translateY(-2px)}
    .toast{position:fixed;z-index:4000;left:50%;bottom:25px;transform:translate(-50%,20px);padding:11px 18px;border-radius:999px;background:#493b50;color:white;font-weight:800;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 25px rgba(0,0,0,.2)}.toast.show{opacity:1;transform:translate(-50%,0)}

    @media(max-width:650px){
      .intro-card{padding:59px 23px 40px;border-radius:31px}.controls{top:auto;bottom:18px;right:12px}.brand{left:12px;top:12px}.brand .brand-title{display:none}.leaflet-control-zoom{margin-top:72px!important;margin-left:12px!important}.progress-pill{padding:10px 12px}.memory-card{max-height:92vh;border-radius:24px}.memory-top{padding:48px 20px 22px}.memory-body{padding:19px 16px 25px}.photo{height:220px}.blurb{font-size:16px}.card-footer{justify-content:center;text-align:center}.modal-layer{padding:10px}}
  </style>
</head>
<body>
  <div id="map" aria-label="Interactive map of memories"></div>

  <section class="intro" id="intro">
    <div class="confetti" aria-hidden="true"><span>🌼</span><span>✨</span><span>🌷</span><span>⭐</span><span>💚</span></div>
    <div class="intro-card">
      <span class="mini-heart">💗</span>
      <h1>You're our world</h1>
      <p class="intro-sub">Let's see where you've been</p>
      <button class="enter-btn" id="enterBtn">Open your map ✨</button>
      <p class="from-us">Made with so much love, from all of us</p>
    </div>
  </section>

  <div class="brand"><span class="brand-heart">💗</span><span class="brand-title">You're our world</span></div>
  <div class="controls">
    <button class="pill" id="musicBtn" title="Music">♪ Silent demo</button>
    <button class="pill progress-pill" id="placesBtn"><span id="progressText">0 / 4</span> hearts</button>
  </div>

  <div class="scrim" id="drawerScrim"></div>
  <aside class="drawer" id="drawer" aria-label="All places">
    <div class="drawer-head"><h2>Our places 💗</h2><button class="x-btn" id="drawerClose">✕</button></div>
    <div class="place-list" id="placeList"></div>
    <button class="reset-btn" id="resetBtn">Reset visited hearts</button>
  </aside>

  <div class="modal-layer" id="modalLayer" role="dialog" aria-modal="true" aria-labelledby="memoryTitle">
    <article class="memory-card">
      <div class="tape"></div>
      <button class="modal-close" id="modalClose" aria-label="Close memory">✕</button>
      <header class="memory-top">
        <div class="big-emoji" id="modalEmoji"></div>
        <h2 id="memoryTitle"></h2>
        <div class="where" id="modalWhere"></div>
      </header>
      <div class="memory-body">
        <div class="gallery" id="modalGallery"></div>
        <div class="blurb" id="modalBlurb"></div>
        <footer class="card-footer">
          <span class="love-note">With love, from all of us 💞</span>
          <button class="nearby-btn" id="nearbyBtn">Visit somewhere nearby →</button>
        </footer>
      </div>
    </article>
  </div>
  <div class="toast" id="toast"></div>
  <audio id="song" loop preload="none"></audio>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    /* ================================================================
       EASY-TO-EDIT CONTENT
       1. Put photos in a photos/place-name folder.
       2. Change each photo path below to match the file.
       3. To add a place, copy one complete { ... } entry.
       4. Add your MP3 path to SONG_FILE, e.g. "music/our-song.mp3".
       ================================================================ */
    const SONG_FILE = "neil/music/oursong.mp3"; // Silent demo for now

    const MEMORIES = [
      {
        id: "london-trafalgar",
        location: "London, UK",
        landmark: "Trafalgar Square",
        title: "You conquered my heart!",
        emoji: "🇬🇧",
        coordinates: [51.5080, -0.1281],
        memory: "I loved being here with you and climbing up to pet the lions",
        photos: ["neil/photos/london/bsm1.jpeg", "photos/london/london-2.jpg"]
      },
      {
        id: "paris-love-wall",
        location: "Paris, France",
        landmark: "Le mur des je t'aime",
        title: "Je t'aime trop ma petite crevette",
        emoji: "🥐",
        coordinates: [48.8848, 2.3387],
        memory: "We walked a lot this day",
        photos: ["photos/paris/paris-1.jpg", "photos/paris/paris-2.jpg"]
      },
      {
        id: "newport-balboa",
        location: "Newport Beach, USA",
        landmark: "Balboa Peninsula",
        title: "One of our favourite date spots",
        emoji: "🍔",
        coordinates: [33.6002, -117.9008],
        memory: "We came here after Walmart in a burst of spontaneity and burger craving even though we had a filet of salmon in the car",
        photos: ["photos/newport-beach/balboa-1.jpg"]
      },
      {
        id: "bangkok-river",
        location: "Bangkok, Thailand",
        landmark: "Chao Phraya River",
        title: "เขาชอบมะพร้าว (I like coconut)",
        emoji: "🥥",
        coordinates: [13.7405, 100.4890],
        memory: "Our trip to the floating market",
        photos: ["photos/bangkok/river-1.jpg"]
      }
    ];

    const intro = document.getElementById('intro');
    const modalLayer = document.getElementById('modalLayer');
    const drawer = document.getElementById('drawer');
    const drawerScrim = document.getElementById('drawerScrim');
    const song = document.getElementById('song');
    const musicBtn = document.getElementById('musicBtn');
    const toast = document.getElementById('toast');
    let currentId = null;
    let markers = {};
    let visited = new Set(JSON.parse(localStorage.getItem('ourWorldVisited') || '[]'));

    if (SONG_FILE) { song.src = SONG_FILE; musicBtn.textContent = '♫ Play song'; }

    const map = L.map('map', {worldCopyJump:true, minZoom:2, zoomControl:true}).setView([25, 5], 2);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);

    const cluster = L.markerClusterGroup({
      showCoverageOnHover:false,
      maxClusterRadius:45,
      spiderfyOnMaxZoom:true,
      iconCreateFunction:c => L.divIcon({
        html:`<div class="cluster-bubble">${c.getChildCount()}</div>`,
        className:'custom-cluster', iconSize:[50,50]
      })
    });

    function heartIcon(id) {
      const seen = visited.has(id) ? ' visited' : '';
      return L.divIcon({
        className:'heart-icon', iconSize:[42,42], iconAnchor:[21,34],
        html:`<div class="heart-marker${seen}"><span class="pulse"></span><span class="heart">♥</span><span class="shine"></span><span class="sparkle">✨</span></div>`
      });
    }

    MEMORIES.forEach(place => {
      const marker = L.marker(place.coordinates, {icon:heartIcon(place.id), title:place.location});
      marker.on('click', () => openMemory(place.id));
      markers[place.id] = marker;
      cluster.addLayer(marker);
    });
    map.addLayer(cluster);

    function saveVisited() {
      localStorage.setItem('ourWorldVisited', JSON.stringify([...visited]));
      document.getElementById('progressText').textContent = `${visited.size} / ${MEMORIES.length}`;
      renderPlaceList();
    }

    function openMemory(id) {
      const place = MEMORIES.find(p => p.id === id);
      if (!place) return;
      currentId = id;
      visited.add(id);
      markers[id].setIcon(heartIcon(id));
      saveVisited();
      document.getElementById('modalEmoji').textContent = place.emoji;
      document.getElementById('memoryTitle').textContent = place.title;
      document.getElementById('modalWhere').textContent = `${place.landmark} · ${place.location}`;
      document.getElementById('modalBlurb').textContent = place.memory;
      const gallery = document.getElementById('modalGallery');
      gallery.innerHTML = '';
      place.photos.forEach((src, i) => {
        const frame = document.createElement('div');
        frame.className = 'photo';
        const filename = src.split('/').pop();
        frame.innerHTML = `<div class="photo-fallback"><span class="f-emoji">${place.emoji}</span><span>Your photo goes here</span><small>${filename}</small></div><img src="${src}" alt="Memory from ${place.location}, photo ${i+1}">`;
        const img = frame.querySelector('img');
        img.addEventListener('load', () => frame.querySelector('.photo-fallback').style.display = 'none');
        img.addEventListener('error', () => img.style.display = 'none');
        gallery.appendChild(frame);
      });
      const next = findNearest(place);
      document.getElementById('nearbyBtn').textContent = next ? `Next nearby: ${next.location} →` : 'Back to the map';
      modalLayer.classList.add('open');
    }

    function closeMemory(){ modalLayer.classList.remove('open'); }

    function distance(a,b){
      const R=6371, rad=x=>x*Math.PI/180;
      const dLat=rad(b.coordinates[0]-a.coordinates[0]);
      const dLon=rad(b.coordinates[1]-a.coordinates[1]);
      const s=Math.sin(dLat/2)**2+Math.cos(rad(a.coordinates[0]))*Math.cos(rad(b.coordinates[0]))*Math.sin(dLon/2)**2;
      return 2*R*Math.asin(Math.sqrt(s));
    }

    function findNearest(place){
      const others=MEMORIES.filter(p=>p.id!==place.id);
      const unvisited=others.filter(p=>!visited.has(p.id));
      const pool=unvisited.length ? unvisited : others;
      return pool.sort((a,b)=>distance(place,a)-distance(place,b))[0] || null;
    }

    function visitFromList(id){
      closeDrawer();
      const p=MEMORIES.find(x=>x.id===id);
      map.flyTo(p.coordinates, Math.max(map.getZoom(),8), {duration:1.1});
      setTimeout(()=>openMemory(id),850);
    }

    function renderPlaceList(){
      const list=document.getElementById('placeList'); list.innerHTML='';
      MEMORIES.forEach(p=>{
        const btn=document.createElement('button');
        btn.className='place-item'+(visited.has(p.id)?' seen':'');
        btn.innerHTML=`<span class="place-emoji">${p.emoji}</span><span><span class="place-name">${p.location}</span><br><span class="place-landmark">${p.landmark}</span></span><span class="status">${visited.has(p.id)?'✨':'💗'}</span>`;
        btn.onclick=()=>visitFromList(p.id); list.appendChild(btn);
      });
    }

    function openDrawer(){drawer.classList.add('open');drawerScrim.classList.add('open')}
    function closeDrawer(){drawer.classList.remove('open');drawerScrim.classList.remove('open')}
    function showToast(text){toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2400)}

    document.getElementById('enterBtn').onclick=()=>{
      intro.classList.add('gone');
      setTimeout(()=>map.invalidateSize(),300);
      if(SONG_FILE){song.play().then(()=>musicBtn.textContent='❚❚ Pause').catch(()=>{});}
    };
    musicBtn.onclick=()=>{
      if(!SONG_FILE){showToast('Silent demo — add your song to SONG_FILE 🎵');return;}
      if(song.paused){song.play();musicBtn.textContent='❚❚ Pause'}else{song.pause();musicBtn.textContent='♫ Play song'}
    };
    document.getElementById('placesBtn').onclick=openDrawer;
    document.getElementById('drawerClose').onclick=closeDrawer;
    drawerScrim.onclick=closeDrawer;
    document.getElementById('modalClose').onclick=closeMemory;
    modalLayer.addEventListener('click',e=>{if(e.target===modalLayer)closeMemory()});
    document.getElementById('nearbyBtn').onclick=()=>{
      const here=MEMORIES.find(p=>p.id===currentId), next=findNearest(here);
      if(!next){closeMemory();return}
      closeMemory();
      map.flyTo(next.coordinates, Math.max(map.getZoom(),8),{duration:1.15});
      setTimeout(()=>openMemory(next.id),900);
    };
    document.getElementById('resetBtn').onclick=()=>{
      visited.clear();localStorage.removeItem('ourWorldVisited');
      MEMORIES.forEach(p=>markers[p.id].setIcon(heartIcon(p.id)));
      saveVisited();showToast('All hearts are pink again 💗');
    };
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMemory();closeDrawer()}});
    renderPlaceList(); saveVisited();
  </script>
</body>
</html>
